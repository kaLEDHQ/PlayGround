<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>محل النسخ '90</title>
<style>
:root{--cream:#e7e2c8;--ink:#171712;--teal:#2c8c86;--orange:#df6c35;--paper:#f5f0d8;--shadow:#3a3932}*{box-sizing:border-box}body{margin:0;background:#25262a;color:var(--ink);font-family:"Tahoma",Arial,sans-serif;height:100vh;overflow:hidden}button,input{font-family:inherit}button{cursor:pointer}.game{height:100vh;background:linear-gradient(135deg,#6c7e78 0 58%,#515e5b 58%);display:grid;grid-template-rows:44px 1fr 34px}.top{background:#efe9c9;border-bottom:3px solid #171712;display:flex;align-items:center;gap:10px;padding:6px 12px}.logo{font-weight:900;font-size:19px}.logo b{color:#c84f27}.stats{margin-right:auto;display:flex;gap:8px}.stat{background:#d8d1af;border:2px solid #77745f;padding:5px 9px;min-width:92px;box-shadow:2px 2px 0 #77745f}.stat small{display:block;font-size:10px}.stat strong{font-size:16px}.heat{direction:ltr}.main{min-height:0;padding:12px;display:grid;grid-template-columns:220px minmax(320px,1fr) 300px;gap:12px}.panel{background:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.25);overflow:hidden}.panel-title{height:32px;background:var(--teal);color:white;border-bottom:3px solid var(--ink);display:flex;align-items:center;padding:0 10px;font-weight:bold}.room{position:relative;background:#9eaa9a}.room-inner{position:absolute;inset:26px 30px 20px;background:linear-gradient(#8da09a 0 16%,#cfc79f 16% 68%,#735844 68%);border:4px solid #4b4b40}.window{position:absolute;top:16%;right:8%;width:34%;height:29%;background:#c6c6aa;border:5px solid #53615e}.window:before{content:"";position:absolute;left:48%;top:-5px;width:5px;height:calc(100% + 10px);background:#53615e}.window:after{content:"";position:absolute;top:48%;width:100%;height:5px;background:#53615e}.poster{position:absolute;top:18%;left:7%;width:76px;height:112px;background:#d05d38;border:5px solid #ece1bd;transform:rotate(-2deg);padding:8px;color:#f6efce;text-align:center;font-weight:bold}.poster:after{content:"TEKKON 3";display:block;border-top:2px solid;margin-top:50px;font-size:12px}.desk{position:absolute;right:30%;bottom:9%;width:48%;height:19%;background:#80583e;border:5px solid #403629}.desk:before{content:"";position:absolute;width:72%;height:58%;right:-45%;bottom:10%;background:#d1c8a6;border:4px solid #403629}.machine{position:absolute;right:9%;bottom:21%;width:22%;height:18%;background:#d6d5bc;border:5px solid #3d403d}.machine:before{content:"";position:absolute;left:15%;top:-18%;width:70%;height:28%;background:#efeee0;border:3px solid #3d403d}.shelf{position:absolute;left:8%;bottom:10%;width:18%;height:38%;border:5px solid #604936;background:linear-gradient(#604936 0 8%,transparent 8% 23%,#604936 23% 31%,transparent 31% 48%,#604936 48% 56%,transparent 56% 73%,#604936 73% 81%,transparent 81%)}.clock{position:absolute;top:8%;left:45%;width:58px;height:58px;border-radius:50%;background:#f2edcf;border:4px solid #333;text-align:center;padding-top:15px;font-weight:bold}.room-label{position:absolute;bottom:8px;right:10px;background:#f1ebcb;border:2px solid;padding:4px 8px}.counter{display:flex;flex-direction:column}.counter-stage{position:relative;height:190px;background:#cdc39e;border-bottom:3px solid}.customer{position:absolute;right:calc(50% - 54px);bottom:12px;width:108px;text-align:center}.head{width:58px;height:58px;border-radius:50%;background:#bd8054;margin:auto;border:4px solid #30302d}.hair{width:68px;height:30px;border-radius:40px 40px 8px 8px;background:#34352f;margin:-62px auto 28px}.body{width:92px;height:82px;background:#71808a;border:4px solid #30302d;border-radius:35px 35px 5px 5px}.customer-info{position:absolute;right:12px;top:12px;font-weight:bold}.thought{position:absolute;left:12px;top:12px;max-width:145px;background:#f8f4dc;border:2px solid;padding:8px;font-size:12px}.counter-actions{padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action{border:2px solid #333;background:#e6dfbd;min-height:46px;font-weight:bold}.action.primary{background:#df6c35;color:white}.action:hover{transform:translateY(-1px)}.phone{background:#cf5b35;color:white}.left-list{padding:8px}.news-item{background:#f6f1d8;border-bottom:2px solid #a7a183;padding:8px;font-size:12px}.news-item strong{display:block;margin-bottom:3px}.right-content{padding:10px}.phase{display:flex;gap:6px;margin-bottom:8px}.phase span{flex:1;text-align:center;padding:5px 2px;background:#aaa58d;border:2px solid #777}.phase .on{background:#dfd3a2;color:#c84f27;font-weight:bold}.morning-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{border:2px solid #777;padding:8px;background:#f3edcf}.card.selected{border:3px solid #d85e32}.card h4{margin:0 0 4px}.card small{display:block;color:#555}.bottom{background:#ded7b4;border-top:3px solid #171712;display:flex;align-items:center;padding:0 10px;gap:10px}.bottom button{border:2px solid #777;background:#eee7c7;padding:4px 10px}.toast{position:fixed;right:50%;bottom:50px;transform:translateX(50%);background:#20211f;color:white;border:3px solid #eee;padding:10px 16px;z-index:20;display:none}.modal-backdrop{position:absolute;inset:0;background:rgba(20,20,18,.48);display:none;align-items:center;justify-content:center;z-index:10}.modal{width:min(520px,90%);background:#ede7c8;border:4px solid #222;box-shadow:8px 8px 0 rgba(0,0,0,.35)}.modal-head{background:#2c8c86;color:white;padding:8px 12px;font-weight:bold}.modal-body{padding:12px}.choices{display:grid;gap:7px;margin-top:10px}.choices button{text-align:right;padding:9px;border:2px solid #777;background:#f4efda}.choices button:hover{background:#dfd3a2}.morning-panel{direction:rtl}.big-btn{width:100%;margin-top:8px;padding:9px;border:3px solid #333;background:#df6c35;color:white;font-weight:bold}.supply{font-size:11px;margin-top:6px}@media(max-width:900px){.main{grid-template-columns:170px 1fr 240px}.top{gap:4px}.stat{min-width:70px}.poster{display:none}}@media(max-width:680px){body{overflow:auto}.game{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.left-panel,.right-panel{display:none}.counter-stage{height:170px}.top{flex-wrap:wrap}.stats{width:100%;margin-right:0}.stat{flex:1}}
</style>
</head>
<body>
<div class="game">
 <div class="top"><div class="logo">محل النسخ <b>'90</b></div><div class="stats"><div class="stat"><small>الفلوس</small><strong id="money">48</strong></div><div class="stat"><small>السمعة</small><strong id="rep">12</strong></div><div class="stat heat"><small>الحرارة</small><strong id="heat">6</strong></div></div></div>
 <div class="main">
  <aside class="panel left-panel"><div class="panel-title">المَعْلومات</div><div class="left-list" id="news"></div></aside>
  <main class="panel counter"><div class="panel-title" id="phaseTitle">الصباح — التجهيز</div>
   <div id="morning" class="morning-panel" style="padding:10px;height:100%;overflow:auto"></div>
   <div id="day" style="display:none;height:calc(100% - 32px)"><div class="counter-stage"><div class="clock" id="clock">09:00</div><div class="customer-info" id="customerName"></div><div class="thought" id="customerTalk"></div><div class="customer" id="customer"><div class="head"></div><div class="hair"></div><div class="body"></div></div></div><div class="counter-actions"><button class="action primary" id="sellBtn">بيع كامل</button><button class="action" id="bargainBtn">تساوم</button><button class="action" id="tableBtn">تحت الطاولة</button><button class="action" id="debtBtn">بالدَّين</button><button class="action" id="noneBtn">ما عندي</button><button class="action phone" id="interruptBtn">مقاطعة!</button></div></div>
   <div id="night" style="display:none;padding:12px;overflow:auto;height:calc(100% - 32px)"></div>
  </main>
  <aside class="panel right-panel"><div class="panel-title">اليوم والتقويم</div><div class="right-content"><div class="phase"><span id="p0" class="on">الصباح</span><span id="p1">النهار</span><span id="p2">الليل</span></div><div id="dateBox"></div><div id="upgradeBox"></div></div></aside>
 </div>
 <div class="bottom"><span id="status">استعد لليوم الأول</span><button id="saveBtn">حفظ</button><button id="muteBtn">صوت: فتح</button><button id="helpBtn">تعليمات</button></div>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head" id="modalHead">قرار</div><div class="modal-body" id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let state={money:48,rep:12,heat:6,day:1,year:1990,month:1,phase:'morning',stock:[],selected:null,customer:null,dues:0,raid:false,scene:'room',supply:'normal',seed:Math.floor(Math.random()*9999),customers:0};
const titles=[
 {name:'تيكون 3',type:'شريط',year:1990,pop:82,cost:8,icon:'🎬'}, {name:'كوب الليل',type:'فيديو',year:1990,pop:66,cost:6,icon:'📼'},
 {name:'FIFI 98',type:'قرص',year:1991,pop:74,cost:10,icon:'💿'}, {name:'جزر الأسوار',type:'لعبة',year:1992,pop:71,cost:11,icon:'🕹️'},
 {name:'سايبر ألف',type:'لعبة كمبيوتر',year:1993,pop:88,cost:13,icon:'💾'}, {name:'جرسون ۹٥',type:'قرص',year:1995,pop:78,cost:14,icon:'💿'},
 {name:'FIFI 98',type:'قرص',year:1996,pop:90,cost:16,icon:'💿'}, {name:'المعبد الرقمي',type:'قرص',year:1998,pop:84,cost:18,icon:'💿'},
 {name:'حرب الشبكة',type:'إنترنت',year:1999,pop:96,cost:22,icon:'🌐'}
];
const names=['سامي','نور','كاظم','ليلى','رامي','مها','وليد','عائشة','فارس','ريم','جاد','تالا','زين','هبة','عمر'];
function save(){localStorage.setItem('copyshop90',JSON.stringify(state));toast('حُفظت اللعبة')}
function load(){try{let s=JSON.parse(localStorage.getItem('copyshop90'));if(s){state=s;toast('تم تحميل الحفظ')}}catch(e){}}
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(x.t);x.t=setTimeout(()=>x.style.display='none',2200)}
function money(n){return Math.max(0,n)}
function dateText(){let y=state.year,m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][state.month];return m+' '+y}
function available(){return titles.filter(t=>t.year<=state.year)}
function renderNews(){let law='منطقة رمادية';if(state.year>=1994)law='حملة فوضى على النسخ';if(state.year>=1997)law='مفتشون يتجولون بالطوائف';if(state.year>=1999)law='التتبع الرقمي أعلن';$('#news').innerHTML=`<div class="news-item"><strong>التاريخ</strong>${dateText()}</div><div class="news-item"><strong>إشاعة حملات</strong>${state.heat>35?'حملة متوقعة قريباً!':'لا توجد علامات واضحة'}</div><div class="news-item"><strong>القانون</strong>${law}</div><div class="news-item"><strong>خبر الأسبوع</strong>${state.year>=1999?'مزود الإنترنت يخفض الاتصال':(state.year>=1994?'جهاز PlayStatik يصل السوق':'الفيديو يملأ الرصيف')}</div>`}
function renderStats(){['money','rep','heat'].forEach(k=>$('#'+k).textContent=state[k]);$('#dateBox').innerHTML=`<div class="card"><h4>${dateText()}</h4><small>اليوم ${state.day}</small><small>البذرة: ${state.seed}</small></div>`;renderNews()}
function startMorning(){state.phase='morning';$('#phaseTitle').textContent='الصباح — التجهيز';$('#morning').style.display='block';$('#day').style.display='none';$('#night').style.display='none';['p0','p1','p2'].forEach((id,i)=>$('#'+id).className=i===0?'on':'');let items=available().slice(-6);$('#morning').innerHTML=`<div class="morning-grid">${items.map((t,i)=>`<div class="card" data-i="${i}"><h4>${t.icon} ${t.name}</h4><small>${t.type} — طلب ${t.pop}%</small><div class="supply">التكلفة: ${t.cost} | جودة الأصلي: ${t.year>=1993?'متذبذبة':'ممتازة'}</div></div>`).join('')}</div><div style="display:flex;gap:8px"><button class="big-btn" id="morningBuy">احصل من المصدر الرسمي</button><button class="big-btn" id="shadyBuy" style="background:#444">احصل من مصدر مشبوه</button></div>`;$$('.card').forEach(c=>c.onclick=()=>{$$('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');state.selected={...available().slice(-6)[+c.dataset.i]}});$('#morningBuy').onclick=()=>acquire(false);$('#shadyBuy').onclick=()=>acquire(true)}
function acquire(shady){if(!state.selected){toast('اختر عنواناً أولاً');return}let cost=shady?Math.max(3,Math.floor(state.selected.cost*.65)):state.selected.cost;if(state.money<cost){toast('الفلوس ما تكفي');return}state.money-=cost;let quality=shady?(40+Math.floor(Math.random()*45)):85+Math.floor(Math.random()*10);state.selected={...state.selected,quality,shady};showModal('نسخ اليد','اضبط السرعة، ضع الشريط، واللصق يُحسّن البيع.',[['سريع — جودة أقل، وقت أقل',()=>copyTune(55)],['متوازن',()=>copyTune(82)],['بطيء — جودة أعلى',()=>copyTune(100)]])}
function copyTune(speed){let q=state.selected.quality*(speed<60?.82:speed>90?1:.94);state.selected.quality=Math.floor(q);closeModal();toast('تم النسخ — جودة '+q.toFixed(0)+'%');setTimeout(startDay,500)}
function startDay(){state.phase='day';$('#phaseTitle').textContent='النهار — الكاونتر';$('#morning').style.display='none';$('#day').style.display='block';$('#night').style.display='none';['p0','p1','p2'].forEach((id,i)=>$('#'+id).className=i===1?'on':'');spawnCustomer();runClock()}
function spawnCustomer(){let n=names[(state.seed+state.customers)%names.length];let special=state.customers%5===4?'مفتش يتخفّى كزبون':(state.heat>30?'ظهر رقم هاتف شرطي في الورق':'');let tag=['يسأل كثيرًا','يدفع نقدًا جديدًا','ينظر للحائط','حذاء بلاستيكي','يتكلم ببطء'][state.customers%5];let quality=state.selected?.quality||70;$('#customerName').textContent=n+' — '+(special||tag);$('#customerTalk').textContent=tag.includes('شرطي')?'':(quality<65?'الخربان؟ أنا واثق بك؟':(state.customers%4===0?'أحتاج نسخة بسرعة، عندي موعد الليلة':'سمعت إن هالعنوان نازل اليوم'));$('#customer').queryContent=n;state.customer={name:n,tag,special,price:Math.max(5,Math.round(state.selected.cost*(.8+quality/100)))};$('#clock').textContent='09:'+String((state.customers*7)%60).padStart(2,'0')}
let clockTimer;
function runClock(){clearInterval(clockTimer);let min=15,max=14;clockTimer=setInterval(()=>{let t=$('#clock').textContent;t=parseInt(t.split(':')[1])+1;if(t>=60){t=0;max++}$('#clock').textContent='09:'+String(t).padStart(2,'0');if(t>=42||max>=48){clearInterval(clockTimer);finishCustomerQueue()}},900)}
function sell(mode){let c=state.customer;if(!c)return;let q=state.selected.quality,base=c.price;let delta=mode==='bar'?base*.7:mode==='table'?base*1.3:mode==='debt'?base*.9:base;if(mode==='none'){state.rep+=1;toast('رفضت البيع — سمعتك ارتفعت قليلاً')}else{state.money+=Math.max(1,Math.round(delta));state.rep+=q>85?3:q>65?1:-3;state.heat+=mode==='table'?3:mode==='bar'?1:0;if(c.special.includes('مفتش')&&mode==='table'){raidMoment()}else if(q<50&&Math.random()<.28){state.rep-=4;toast('الزبون اكتشف الخراب')}}state.customers++;state.rep=Math.max(0,state.rep);state.heat=Math.min(100,Math.max(0,state.heat));renderStats();if(state.customers%3===0)randomInterrupt();else spawnCustomer()}
function raidMoment(){state.heat=100;showModal('مسكة','المفتش يطلب مصادرة المحل. الغرامة تصير دين ويوقفونك أسبوعين.',[['دفع الغرامة',()=>resolveRaid(true)],['التوقف والاستخلاص',()=>resolveRaid(false)]])}
function resolveRaid(pay){if(pay){let fine=20+state.year*0.1;state.dues+=fine;state.money-=Math.min(state.money,20)}else{state.dues+=12}state.heat=18;closeModal();toast('خَرِجت بعلامة ولن تموت اللعبة');state.month+=2;if(state.month>=12){state.month=0;state.year++}}
function randomInterrupt(){let events=[['دق على الباب','تخبّي البضاعة أو تفتح؟',[['تخبّي سريعاً',()=>{state.heat=Math.max(0,state.heat-4);closeModal();spawnCustomer()}],['تفتح',()=>{state.money-=2;closeModal();spawnCustomer()}]]],['مكالمة كبيرة','مكتب يريد طلبية كبيرة اليوم',[['اقبلها',()=>{state.money+=18;state.heat+=8;closeModal();spawnCustomer()}],['رفض بأدب',()=>{state.rep+=1;closeModal();spawnCustomer()}]]],['ناسخ يخرب','ستة نسخ ضاعت، هل تصرف عليها؟',[['تصليح الآن',()=>{state.money-=8;closeModal();spawnCustomer()}],['اتركها',()=>{state.rep-=2;closeModal();spawnCustomer()}]]]];let e=events[Math.floor(Math.random()*events.length)];showModal(e[0],e[1],e[2].map(x=>[x[0],()=>x[1]()]))}
function finishCustomerQueue(){showModal('نهاية النهار','الطابور هدأ.',[['اذهب للحساب',()=>{closeModal();startNight()}]])}
function startNight(){state.phase='night';$('#phaseTitle').textContent='الليل — الحساب والقرار';$('#morning').style.display='none';$('#day').style.display='none';$('#night').style.display='block';['p0','p1','p2'].forEach((id,i)=>$('#'+id).className=i===2?'on':'');let sales=state.customers*3;if(state.year>=1994)sales+=4;$('#night').innerHTML=`<h3 style="margin:4px 0">تقرير اليوم ${state.day}</h3><div class="morning-grid"><div class="card"><h4>المبيعات</h4><strong>${sales}</strong><small>عملاء خلال اليوم: ${state.customers}</small></div><div class="card"><h4>السمعة والحرارة</h4><strong>${state.rep} / ${state.heat}</strong><small>${state.heat>40?'الخطر يقترب':'الوضع هادئ نسبياً'}</small></div></div><div class="choices"><button onclick="upgrade('رف جديد',18)">رف جديد — 18: يضيف مبيعات ثابتة</button><button onclick="upgrade('ناسخ إضافي',32)">ناسخ إضافي — 32: نسخ أسرع وأكفأ</button><button onclick="upgrade('كنبة انتظار',14)">كنبة انتظار — 14: الزبائن يتأخرون أقل</button></div><button class="big-btn" onclick="endNight()">إنهاء القرار والانتقال للغد</button>`}
function upgrade(name,cost){if(state.money<cost){toast('الفلوس لا تكفي');return}state.money-=cost;toast('تم شراء '+name);renderStats()}
function endNight(){let eventIndex=(state.day+state.seed)%5;if(eventIndex===2){showModal('قرار صعب','مورد يعرض شريطاً نادراً بسعر مغر. هل تخاطر؟',[['اشتري',()=>{state.money-=14;state.heat+=5;closeModal();advanceDay()}],['ارفض',()=>{state.rep+=2;closeModal();advanceDay()}]])}else advanceDay()}
function advanceDay(){state.day++;state.month+=1;if(state.month>=12){state.month=0;state.year++}if(state.year>=2000){showModal('نهاية المشوار','وصلت سنة 2000. الإنترنت قلب السوق، لكن قصتك ما انتهت.',[['ابدأ مشواراً جديداً',()=>location.reload()],['كمل التجربة',()=>{closeModal();state.year=1999;startMorning()}]]);return}state.customers=0;state.heat=Math.max(0,state.heat-4);state.money=money(state.money);renderStats();startMorning()}
function showModal(head,body,choices){$('#modalHead').textContent=head;$('#modalBody').innerHTML=`<p>${body}</p><div class="choices">${choices.map((c,i)=>`<button data-c="${i}">${c[0]}</button>`).join('')}</div>`;$('#modal').style.display='flex';$$('#modalBody button').forEach((b,i)=>b.onclick=choices[i][1])}
function closeModal(){$('#modal').style.display='none'}
$('#sellBtn').onclick=()=>sell('sell');$('#bargainBtn').onclick=()=>sell('bar');$('#tableBtn').onclick=()=>sell('table');$('#debtBtn').onclick=()=>sell('debt');$('#noneBtn').onclick=()=>sell('none');$('#interruptBtn').onclick=randomInterrupt;$('#saveBtn').onclick=save;$('#helpBtn').onclick=()=>showModal('تعليمات','الصباح: اختر ونسخ. النهار: قرر مع الزبائن. الليل: اشتري تطويرات واستعد للغد. لا يوجد Game Over دائم؛ المسكة تنقل القصة وتنتج ندوب.',[['فهمت',closeModal]]);$('#muteBtn').onclick=()=>{$('#muteBtn').textContent=$('#muteBtn').textContent.includes('فتح')?'صوت: مغلق':'صوت: فتح'};
load();renderStats();startMorning();
</script>
</body></html>
